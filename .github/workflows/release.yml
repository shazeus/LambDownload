name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  source-pack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Prepare bundled Python dependencies
        run: npm run prepare:python-vendor

      - name: Verify Python worker
        run: npm run verify:python-worker

      - name: Build source release package
        run: npm run release:pack

      - name: Publish source package
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.zip
          generate_release_notes: true

  desktop-build:
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: macos
          - os: windows-latest
            artifact: windows

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Prepare bundled Python dependencies
        run: npm run prepare:python-vendor

      - name: Verify Python worker
        run: npm run verify:python-worker

      - name: Build desktop installer
        run: npm run desktop:pack

      - name: Publish desktop installer
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-desktop/*.dmg
            dist-desktop/*.zip
            dist-desktop/*.exe
          generate_release_notes: true
